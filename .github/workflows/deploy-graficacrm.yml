name: Build e Publicar GráficaCRM (GHCR)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Log in no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem GráficaCRM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/graficacrm:latest
            ghcr.io/${{ github.repository_owner }}/deskcommcrm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Notificar e Atualizar VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS via SSH (se configurado)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '18.230.143.108' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Aviso: VPS_SSH_KEY não configurado nos Secrets do GitHub."
            echo "O Watchtower ativo na VPS (18.230.143.108) fará o download e a atualização da nova imagem automaticamente em até 60 segundos."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST 'cd /home/ubuntu/deskcommcrm && git pull origin main && docker compose -f docker-compose.prod.yml pull app && docker compose -f docker-compose.prod.yml up -d --no-deps app'
          echo "Deploy na VPS concluído com sucesso!"
